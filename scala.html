<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cittadella Gozo - Prova scala AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
  <style>
    html,body {margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,Arial,sans-serif;background:#f1f3f5}
    model-viewer {width:100%;height:100%;--progress-bar-color:#157c97}
    #controls {position:absolute;left:12px;top:12px;z-index:8;display:flex;flex-wrap:wrap;gap:6px;max-width:65%;}
    #controls button {font-size:13px;background:#fff;color:#172338;border:1px solid #8b98a4;border-radius:8px;padding:9px;cursor:pointer}
    #controls button.selected {background:#155b78;color:#fff;border-color:#155b78}
    #ar-button {position:absolute;top:14px;right:12px;background:#fff;color:#172338;border:1px solid #8b98a4;border-radius:8px;padding:11px;font-size:14px;font-weight:bold;cursor:pointer}
    #diagnostica {position:absolute;bottom:12px;left:12px;right:12px;background:rgba(6,23,38,.86);color:#fff;padding:12px 13px;border-radius:10px;font-size:13px;line-height:1.5;z-index:9;pointer-events:none}
    #diagnostica strong {color:#b5e9ff}
    model-viewer[ar-status="session-started"] #controls,model-viewer[ar-status="object-placed"] #controls{display:none}
  </style>
</head>
<body>
<model-viewer id="viewer"
 src="cittadella_gozo_3d-v1.glb"
 alt="Modello 3D Cittadella di Gozo in realtà aumentata"
 ar ar-modes="webxr quick-look" ar-placement="floor" ar-scale="auto"
 camera-controls auto-rotate
 scale="0.01 0.01 0.01"
 shadow-intensity="1" exposure="1.2" environment-image="neutral">
 <div id="controls" aria-label="Seleziona la scala per il test">
   <button type="button" data-s="0.01" class="selected">Scala 0,01</button>
   <button type="button" data-s="0.003">Più piccolo</button>
   <button type="button" data-s="0.03">Più grande</button>
 </div>
 <button slot="ar-button" id="ar-button">Vedi in AR</button>
 <div id="diagnostica">
   <strong>TEST SCALA • Model Viewer 4.4.0</strong><br>
   Modello: <span id="loaded">in caricamento</span> | AR: <span id="status">non avviata</span> | Tracking: <span id="tracking">nessun evento</span><br>
   Scala selezionata: <span id="scale">0,01</span><br>
   Dimensioni (m): <span id="dims">in attesa</span><br>
   Centro (m): <span id="center">in attesa</span>
 </div>
</model-viewer>
<script type="module">
 const viewer = document.querySelector('#viewer');
 const f = n => Number.isFinite(n) ? n.toFixed(3) : String(n);
 const update = () => { try {
   const d=viewer.getDimensions(); const c=viewer.getBoundingBoxCenter();
   document.querySelector('#dims').textContent = [d.x,d.y,d.z].map(f).join(' × ');
   document.querySelector('#center').textContent = [c.x,c.y,c.z].map(f).join(', ');
 } catch (err) {document.querySelector('#dims').textContent = 'non disponibili';} };
 viewer.addEventListener('load', () => { document.querySelector('#loaded').textContent='caricato'; update(); });
 viewer.addEventListener('error', ev => {document.querySelector('#loaded').textContent='errore: '+(ev.detail?.type ?? 'sconosciuto');});
 viewer.addEventListener('ar-status', ev => {document.querySelector('#status').textContent=({
  'not-presenting':'non avviata','session-started':'sessione avviata','object-placed':'oggetto collocato','failed':'errore AR'
 })[ev.detail?.status] ?? String(ev.detail?.status ?? 'sconosciuto');});
 viewer.addEventListener('ar-tracking', ev => {document.querySelector('#tracking').textContent=ev.detail?.status==='tracking'?'attivo':'non attivo';});
 document.querySelectorAll('[data-s]').forEach(button => button.addEventListener('click', () => {
  const s=button.dataset.s;
  viewer.setAttribute('scale',`${s} ${s} ${s}`);
  viewer.updateFraming();
  document.querySelector('#scale').textContent=s.replace('.',',');
  document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('selected',b===button));
  requestAnimationFrame(update);
 }));
</script>
</body>
</html>
